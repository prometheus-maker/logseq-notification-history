name: Build release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - name: Package
        run: |
          mkdir -p pkg/notification-history
          cp -r package.json dist icon.png README.md LICENSE pkg/notification-history/
          cd pkg && zip -r ../notification-history-${GITHUB_REF_NAME}.zip notification-history
      - uses: softprops/action-gh-release@v2
        with:
          files: notification-history-${{ github.ref_name }}.zip
